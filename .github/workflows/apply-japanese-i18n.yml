# One-shot Japanese i18n validation after verified payload repair.
name: Apply Japanese i18n

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/japanese-i18n'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/japanese-i18n
          fetch-depth: 0

      - name: Rebuild and apply the verified patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/apply-japanese-i18n.gz-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/apply-japanese-i18n.mjs
          python3 - <<'PY'
          from pathlib import Path
          script = Path('/tmp/apply-japanese-i18n.mjs')
          source = script.read_text(encoding='utf-8')
          for name in ('formatLabel', 'engines', 'targets'):
              source = source.replace('${' + name + '}', r'\${' + name + '}')
          source = source.replace(
              '<button id="locale-en">EN</button>',
              '<button id="locale-en" type="button">EN</button>',
          )
          source = source.replace(
              '<button id="locale-ja">日本語</button>',
              '<button id="locale-ja" type="button">日本語</button>',
          )
          source = source.replace(
              "const write = (file, content) => {\n  fs.writeFileSync(path.join(root, file), content)\n  changed.add(file)\n}",
              "const write = (file, content) => {\n  const target = path.join(root, file)\n  fs.mkdirSync(path.dirname(target), { recursive: true })\n  fs.writeFileSync(target, content)\n  changed.add(file)\n}",
          )
          source = source.replace(
              "const zhDemo = extractCatalog(demo, \"'zh-CN': {\", \"'en-US': {\")",
              "const zhDemo = extractCatalog(demo, \"'zh-CN': {\", \"'en-US': {\").replace(\"'zh-CN': {\", '')",
          )
          source = source.replace(
              "  assert(read(file).includes('ja-JP'), file + ' is missing ja-JP coverage')",
              "  const fileSource = read(file)\n  const delegatesLocaleResolution = file.endsWith('useDemoPreferences.ts') && fileSource.includes('normalizeFileViewerLocale')\n  assert(fileSource.includes('ja-JP') || delegatesLocaleResolution, file + ' is missing Japanese locale coverage')",
          )
          script.write_text(source, encoding='utf-8')
          PY
          node --check /tmp/apply-japanese-i18n.mjs
          rm -f \
            .github/i18n-patch-error.log \
            .github/scripts/apply-japanese-i18n.part-*.b64 \
            .github/scripts/apply-japanese-i18n.gz-*.b64 \
            .github/workflows/apply-japanese-i18n.yml
          node /tmp/apply-japanese-i18n.mjs > /tmp/apply-japanese-i18n.log 2>&1

      - name: Upload patch diagnostics
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: japanese-i18n-patch-error
          path: /tmp/apply-japanese-i18n.log
          if-no-files-found: error
          retention-days: 1

      - name: Report patch failure
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          cat /tmp/apply-japanese-i18n.log || true
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: pnpm test > /tmp/japanese-i18n-test.log 2>&1

      - name: Upload test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: japanese-i18n-test-error
          path: /tmp/japanese-i18n-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Report test failure
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          cat /tmp/japanese-i18n-test.log || true
          exit 1

      - name: Build packages and applications
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm verify:browser-smoke

      - name: Commit verified Japanese support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(i18n): add comprehensive Japanese support"
          git push origin HEAD:feature/japanese-i18n
