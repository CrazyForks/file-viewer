# One-shot Japanese i18n validation after verified payload repair.
name: Apply Japanese i18n

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/japanese-i18n'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/japanese-i18n
          fetch-depth: 0

      - name: Rebuild and apply the verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/apply-japanese-i18n.gz-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/apply-japanese-i18n.mjs
          node --check /tmp/apply-japanese-i18n.mjs
          rm -f \
            .github/i18n-patch-error.log \
            .github/scripts/apply-japanese-i18n.part-*.b64 \
            .github/scripts/apply-japanese-i18n.gz-*.b64 \
            .github/workflows/apply-japanese-i18n.yml

          set +e
          node /tmp/apply-japanese-i18n.mjs > /tmp/apply-japanese-i18n.log 2>&1
          patch_status=$?
          set -e
          cat /tmp/apply-japanese-i18n.log

          if [ "$patch_status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/apply-japanese-i18n.log .github/i18n-patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/i18n-patch-error.log
            git commit -m "chore(i18n): capture patch failure [skip ci]"
            git push origin HEAD:feature/japanese-i18n
            exit "$patch_status"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build packages and applications
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm verify:browser-smoke

      - name: Commit verified Japanese support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(i18n): add comprehensive Japanese support"
          git push origin HEAD:feature/japanese-i18n
