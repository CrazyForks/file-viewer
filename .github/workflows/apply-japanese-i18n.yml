name: Apply Japanese i18n

on:
  push:
    branches:
      - feature/japanese-i18n

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/japanese-i18n
          fetch-depth: 0

      - name: Rebuild and apply the verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/apply-japanese-i18n.gz-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/apply-japanese-i18n.mjs
          node --check /tmp/apply-japanese-i18n.mjs
          rm -f \
            .github/scripts/apply-japanese-i18n.part-*.b64 \
            .github/scripts/apply-japanese-i18n.gz-*.b64 \
            .github/workflows/apply-japanese-i18n.yml
          node /tmp/apply-japanese-i18n.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build packages and applications
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm verify:browser-smoke

      - name: Commit verified Japanese support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(i18n): add comprehensive Japanese support"
          git push origin HEAD:feature/japanese-i18n
