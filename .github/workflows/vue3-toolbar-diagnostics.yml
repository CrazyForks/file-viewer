name: Vue 3 toolbar diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vue3-toolbar-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build focused packages
        run: |
          pnpm --filter @file-viewer/core build
          pnpm --filter @file-viewer/vue3 build

      - name: Run toolbar contract verifier
        id: verify
        shell: bash
        run: |
          set +e
          node scripts/verify-vue3-toolbar.mjs > /tmp/vue3-toolbar-verify.log 2>&1
          status=$?
          cat /tmp/vue3-toolbar-verify.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vue3-toolbar-verifier-output
          path: /tmp/vue3-toolbar-verify.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when verification failed
        if: steps.verify.outputs.status != '0'
        run: exit 1
